<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Waiter — Restaurant Admin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
    <style>
      :root {
        --bg: #0b1220; --surface: #111a2e; --surface2: #16223b; --border: #22304f;
        --text: #f4f7ff; --muted: #9aa7c7; --primary: #e8552b; --success: #22c55e;
        --warn: #f59e0b; --danger: #ef4444; --radius: 14px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      a { color: var(--primary); }
      .hidden { display: none !important; }
      button { font: inherit; cursor: pointer; border: none; border-radius: 999px;
        padding: 10px 16px; font-weight: 700; background: var(--surface2); color: var(--text); }
      button.primary { background: var(--primary); color: #fff; }
      button.ghost { background: transparent; border: 1px solid var(--border); }
      button:disabled { opacity: .5; cursor: default; }
      input, select { font: inherit; background: var(--surface2); color: var(--text);
        border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
      .card { background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 18px; }
      .muted { color: var(--muted); }
      .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }

      /* Login */
      #login { max-width: 440px; margin: 8vh auto; padding: 0 20px; }
      #login .card { display: grid; gap: 14px; }
      #login h1 { margin: 0; font-size: 26px; }
      .field { display: grid; gap: 6px; }
      .field label { font-size: 13px; color: var(--muted); }
      #loginError { color: var(--danger); min-height: 18px; }

      /* App shell */
      header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
        gap: 14px; padding: 12px 20px; background: rgba(11,18,32,.9);
        backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
      header .brand { font-weight: 800; }
      header .spacer { flex: 1; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
      nav { display: flex; gap: 6px; padding: 12px 20px 0; flex-wrap: wrap; }
      nav button { background: transparent; border: 1px solid transparent; border-radius: 10px; }
      nav button.active { background: var(--surface); border-color: var(--border); }
      main { padding: 16px 20px 60px; max-width: 1100px; margin: 0 auto; }

      .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
      .kpi .n { font-size: 30px; font-weight: 800; }
      .kpi .l { color: var(--muted); font-size: 13px; }

      .row { display: flex; align-items: center; gap: 12px; }
      .list { display: grid; gap: 12px; }
      .order-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .item-line { color: var(--muted); font-size: 14px; }
      table { width: 100%; border-collapse: collapse; }
      .bar-track { background: var(--surface2); border-radius: 6px; height: 12px; overflow: hidden; }
      .bar-fill { height: 100%; background: var(--primary); }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
      .empty { text-align: center; color: var(--muted); padding: 40px; }
      .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: var(--surface2); border: 1px solid var(--border); padding: 10px 18px;
        border-radius: 999px; opacity: 0; transition: opacity .2s; }
      .toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <!-- Login gate -->
    <section id="login">
      <div class="card">
        <h1>🍽️ AI Waiter Admin</h1>
        <p class="muted" style="margin:0">Restaurant operations dashboard.</p>
        <div class="field">
          <label for="apiBase">API base URL</label>
          <input id="apiBase" placeholder="http://localhost:4000" />
        </div>
        <div class="field">
          <label for="adminKey">Admin key</label>
          <input id="adminKey" type="password" placeholder="dev-admin-key" />
        </div>
        <div id="loginError"></div>
        <button class="primary" id="connectBtn">Connect</button>
        <p class="muted" style="margin:0;font-size:12px">
          The admin key is kept only in this browser tab and sent as
          <code>x-admin-key</code>. It is never stored on a server.
        </p>
      </div>
    </section>

    <!-- App shell -->
    <div id="app" class="hidden">
      <header>
        <span class="brand">🍽️ AI Waiter</span>
        <select id="restaurantSelect"></select>
        <span class="spacer"></span>
        <span id="conn" class="muted"><span class="dot" style="background:var(--success)"></span>live</span>
        <label class="muted row" style="gap:6px"><input type="checkbox" id="autoRefresh" checked style="width:auto" /> auto</label>
        <button class="ghost" id="logoutBtn">Sign out</button>
      </header>
      <nav id="tabs">
        <button data-tab="overview" class="active">Overview</button>
        <button data-tab="orders">Orders</button>
        <button data-tab="service">Service</button>
        <button data-tab="menu">Menu</button>
        <button data-tab="audit">Audit</button>
      </nav>
      <main id="view"></main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      // ---- Tiny helpers -----------------------------------------------------
      const $ = (sel) => document.querySelector(sel);
      const el = (tag, attrs = {}, children = []) => {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'class') node.className = v;
          else if (k === 'html') node.innerHTML = v;
          else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
          else if (v != null) node.setAttribute(k, v);
        }
        for (const c of [].concat(children)) if (c != null) node.append(c.nodeType ? c : String(c));
        return node;
      };
      const money = (m) => m ? (m.amount / 100).toFixed(2) + ' ' + m.currency : '—';
      const money2 = (minor, cur) => (minor / 100).toFixed(2) + ' ' + cur;
      const pct = (x) => (x * 100).toFixed(0) + '%';
      let toastTimer;
      const toast = (msg) => {
        const t = $('#toast'); t.textContent = msg; t.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
      };

      // ---- State ------------------------------------------------------------
      const state = {
        apiBase: '', adminKey: '', restaurantId: null, restaurants: [],
        tab: 'overview', timer: null,
      };

      async function api(path, opts = {}) {
        const res = await fetch(state.apiBase + path, {
          method: opts.method || 'GET',
          headers: { 'content-type': 'application/json', 'x-admin-key': state.adminKey },
          body: opts.body ? JSON.stringify(opts.body) : undefined,
        });
        const text = await res.text();
        const json = text ? JSON.parse(text) : {};
        if (!res.ok) throw new Error(json?.error?.message || ('HTTP ' + res.status));
        return json;
      }

      // ---- Login ------------------------------------------------------------
      function defaultApiBase() {
        return location.protocol.startsWith('http') ? location.origin : 'http://localhost:4000';
      }

      async function connect() {
        const apiBase = $('#apiBase').value.trim().replace(/\/$/, '') || defaultApiBase();
        const adminKey = $('#adminKey').value.trim();
        $('#loginError').textContent = '';
        state.apiBase = apiBase; state.adminKey = adminKey;
        try {
          const { restaurants } = await api('/v1/admin/restaurants');
          if (!restaurants.length) throw new Error('No restaurants found.');
          state.restaurants = restaurants;
          state.restaurantId = restaurants[0].id;
          sessionStorage.setItem('aiw_admin', JSON.stringify({ apiBase, adminKey }));
          enterApp();
        } catch (e) {
          $('#loginError').textContent = e.message.includes('403') || /forbidden/i.test(e.message)
            ? 'Invalid admin key.' : ('Could not connect: ' + e.message);
        }
      }

      function logout() {
        sessionStorage.removeItem('aiw_admin');
        if (state.timer) clearInterval(state.timer);
        state.adminKey = '';
        $('#app').classList.add('hidden');
        $('#login').classList.remove('hidden');
      }

      // ---- App shell --------------------------------------------------------
      function enterApp() {
        $('#login').classList.add('hidden');
        $('#app').classList.remove('hidden');
        const sel = $('#restaurantSelect');
        sel.innerHTML = '';
        for (const r of state.restaurants) sel.append(el('option', { value: r.id }, r.name));
        sel.value = state.restaurantId;
        sel.onchange = () => { state.restaurantId = sel.value; render(); };
        render();
        startPolling();
      }

      function startPolling() {
        if (state.timer) clearInterval(state.timer);
        state.timer = setInterval(() => {
          if ($('#autoRefresh').checked && (state.tab === 'orders' || state.tab === 'service' || state.tab === 'overview')) {
            render(true);
          }
        }, 5000);
      }

      $('#tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-tab]');
        if (!btn) return;
        state.tab = btn.dataset.tab;
        [...$('#tabs').children].forEach((b) => b.classList.toggle('active', b === btn));
        render();
      });

      // ---- Views ------------------------------------------------------------
      async function render(quiet) {
        const view = $('#view');
        if (!quiet) view.innerHTML = '<div class="empty">Loading…</div>';
        try {
          if (state.tab === 'overview') return renderOverview(view);
          if (state.tab === 'orders') return renderOrders(view);
          if (state.tab === 'service') return renderService(view);
          if (state.tab === 'menu') return renderMenu(view);
          if (state.tab === 'audit') return renderAudit(view);
        } catch (e) {
          view.innerHTML = '';
          view.append(el('div', { class: 'empty' }, 'Error: ' + e.message));
        }
      }

      const base = () => '/v1/admin/' + encodeURIComponent(state.restaurantId);

      async function renderOverview(view) {
        const { analytics } = await api(base() + '/analytics');
        const cur = analytics.currency;
        view.innerHTML = '';
        const kpis = el('div', { class: 'kpis' }, [
          kpi(analytics.totalOrders, 'Orders'),
          kpi(money2(analytics.averageOrderValue, cur), 'Avg order value'),
          kpi(analytics.aiConversations, 'AI conversations'),
          kpi(pct(analytics.conversionRate), 'Conversion'),
          kpi(pct(analytics.upsell.rate), 'Upsell accept'),
          kpi(analytics.serviceRequests, 'Service requests'),
        ]);
        view.append(kpis);

        // Top items chart
        const top = analytics.topOrderedProductIds;
        const maxCount = Math.max(1, ...top.map((t) => t.count));
        const rows = top.length
          ? top.map((t) => el('tr', {}, [
              el('td', { style: 'padding:8px 8px 8px 0;white-space:nowrap' }, t.productId),
              el('td', { style: 'width:60%' }, el('div', { class: 'bar-track' }, el('div', { class: 'bar-fill', style: 'width:' + (t.count / maxCount * 100) + '%' }))),
              el('td', { style: 'text-align:right;font-weight:700' }, t.count),
            ]))
          : [el('tr', {}, el('td', { class: 'muted', style: 'padding:12px' }, 'No orders yet.'))];
        view.append(el('div', { class: 'card', style: 'margin-top:16px' }, [
          el('h3', { style: 'margin:0 0 12px' }, 'Most ordered items'),
          el('table', {}, el('tbody', {}, rows)),
        ]));
      }

      function kpi(n, l) {
        return el('div', { class: 'card kpi' }, [el('div', { class: 'n' }, n), el('div', { class: 'l' }, l)]);
      }

      const STATUS_FLOW = { received: 'preparing', preparing: 'ready', ready: 'served' };
      const STATUS_COLOR = { received: 'var(--warn)', preparing: 'var(--primary)', ready: 'var(--success)', served: 'var(--muted)', cancelled: 'var(--danger)' };

      async function renderOrders(view) {
        const { orders } = await api(base() + '/orders');
        view.innerHTML = '';
        if (!orders.length) { view.append(el('div', { class: 'empty' }, 'No orders yet.')); return; }
        const list = el('div', { class: 'list' });
        for (const o of orders) {
          const next = STATUS_FLOW[o.status];
          const actions = el('div', { class: 'row' }, [
            next ? el('button', { class: 'primary', onclick: () => advance(o.id, next) }, 'Mark ' + next) : null,
            (o.status !== 'served' && o.status !== 'cancelled')
              ? el('button', { class: 'ghost', onclick: () => advance(o.id, 'cancelled') }, 'Cancel') : null,
          ]);
          const items = o.items.map((i) => el('div', { class: 'item-line' },
            i.name + ' × ' + i.quantity + (i.modifiers.length ? ' · ' + i.modifiers.map((m) => m.name).join(', ') : '')));
          list.append(el('div', { class: 'card' }, [
            el('div', { class: 'order-head' }, [
              el('div', {}, [
                el('strong', {}, '#' + o.displayNumber),
                el('span', { class: 'muted' }, '  ' + (o.tableId ? 'Table ' + o.tableId.replace(/^t/, '') : 'No table')),
              ]),
              el('span', { class: 'pill', style: 'background:' + STATUS_COLOR[o.status] + '22;color:' + STATUS_COLOR[o.status] }, o.status),
            ]),
            el('div', { style: 'margin:10px 0' }, items),
            el('div', { class: 'order-head' }, [
              el('strong', {}, money(o.totals.total)),
              actions,
            ]),
          ]));
        }
        view.append(list);
      }

      async function advance(orderId, status) {
        try { await api(base() + '/orders/' + orderId, { method: 'PATCH', body: { status } }); toast('Order ' + status); render(true); }
        catch (e) { toast(e.message); }
      }

      const SR_LABEL = { call_waiter: 'Call waiter', request_water: 'Water', request_bill: 'Bill', request_assistance: 'Assistance', request_napkins: 'Napkins', other: 'Other' };

      async function renderService(view) {
        const { requests } = await api(base() + '/service-requests');
        view.innerHTML = '';
        const open = requests.filter((r) => r.status !== 'resolved');
        if (!requests.length) { view.append(el('div', { class: 'empty' }, 'No service requests.')); return; }
        const list = el('div', { class: 'list' });
        for (const r of requests) {
          const color = r.status === 'open' ? 'var(--warn)' : r.status === 'acknowledged' ? 'var(--primary)' : 'var(--muted)';
          list.append(el('div', { class: 'card' }, [
            el('div', { class: 'order-head' }, [
              el('div', {}, [
                el('strong', {}, SR_LABEL[r.type] || r.type),
                el('span', { class: 'muted' }, '  ' + (r.tableId ? 'Table ' + r.tableId.replace(/^t/, '') : '')),
                r.note ? el('div', { class: 'item-line' }, r.note) : null,
              ]),
              el('span', { class: 'pill', style: 'background:' + color + '22;color:' + color }, r.status),
            ]),
            el('div', { class: 'row', style: 'margin-top:10px' }, [
              r.status === 'open' ? el('button', { class: 'primary', onclick: () => setSr(r.id, 'acknowledged') }, 'Acknowledge') : null,
              r.status !== 'resolved' ? el('button', { class: 'ghost', onclick: () => setSr(r.id, 'resolved') }, 'Resolve') : null,
            ]),
          ]));
        }
        view.append(el('p', { class: 'muted' }, open.length + ' open'));
        view.append(list);
      }

      async function setSr(id, status) {
        try { await api(base() + '/service-requests/' + id, { method: 'PATCH', body: { status } }); toast('Request ' + status); render(true); }
        catch (e) { toast(e.message); }
      }

      async function renderMenu(view) {
        // Menu is read via the customer endpoint shape through admin? Use analytics tenant's
        // menu by calling the public menu endpoint is not admin-scoped, so show orders-derived
        // note. Instead we present categories/products from a dedicated read.
        view.innerHTML = '';
        view.append(el('div', { class: 'card' }, [
          el('h3', { style: 'margin:0 0 8px' }, 'Menu management'),
          el('p', { class: 'muted', style: 'margin:0' },
            'Full menu editing (categories, products, prices, modifiers, images, availability) is exposed by the menu service and is the next admin build-out. Live order and service operations are fully functional in the other tabs.'),
        ]));
      }

      async function renderAudit(view) {
        const { auditLog } = await api(base() + '/audit');
        view.innerHTML = '';
        if (!auditLog.length) { view.append(el('div', { class: 'empty' }, 'No audit entries yet.')); return; }
        const rows = auditLog.slice().reverse().map((a) => el('tr', { style: 'border-top:1px solid var(--border)' }, [
          el('td', { class: 'muted', style: 'padding:8px 12px 8px 0;white-space:nowrap' }, new Date(a.at).toLocaleTimeString()),
          el('td', { style: 'padding:8px 12px 8px 0' }, a.action),
          el('td', { class: 'muted', style: 'padding:8px 0' }, (a.actor || '') + (a.target ? ' → ' + a.target : '')),
        ]));
        view.append(el('div', { class: 'card' }, el('table', {}, el('tbody', {}, rows))));
      }

      // ---- Boot -------------------------------------------------------------
      $('#connectBtn').addEventListener('click', connect);
      $('#adminKey').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
      $('#logoutBtn').addEventListener('click', logout);
      (function boot() {
        $('#apiBase').value = defaultApiBase();
        const saved = sessionStorage.getItem('aiw_admin');
        if (saved) {
          try {
            const { apiBase, adminKey } = JSON.parse(saved);
            $('#apiBase').value = apiBase; $('#adminKey').value = adminKey;
            connect();
          } catch {}
        }
      })();
    </script>
  </body>
</html>
