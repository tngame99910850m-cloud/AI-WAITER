# Render Blueprint — deploys the AI Waiter API as a Docker web service.
# In Render: New + → Blueprint → connect this repo → select the branch that has
# this file → Apply. Or create a Web Service manually (runtime: Docker).
services:
  - type: web
    name: ai-waiter-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: PERSISTENCE
        value: memory
      - key: CORS_ORIGINS
        value: "*"
      - key: CLIENT_API_KEYS
        value: dev-client-key
      - key: ADMIN_API_KEY
        generateValue: true
